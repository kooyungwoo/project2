# SonarQube / SonarCloud 프로젝트 설정
# 서버의 프로젝트 키/이름에 맞게 수정해서 사용하세요.
sonar.projectKey=project2
sonar.projectName=project2
sonar.sourceEncoding=UTF-8

# 분석 대상 소스 (테스트 코드는 없음)
sonar.sources=src
sonar.tests=

# TypeScript 분석을 위한 tsconfig 경로
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.tsconfigPath=tsconfig.json

# 분석 제외 대상
sonar.exclusions=**/node_modules/**,**/dist/**,src/routeTree.gen.ts,src/vite-env.d.ts,src/types/**/*.d.ts,src/assets/**
# 중복 코드(CPD) 검사 제외 대상 (shadcn/ui 생성 코드 등)
sonar.cpd.exclusions=src/components/ui/**,src/routeTree.gen.ts

# 외부 린트 리포트 연동 (npm run lint:report / lint:style:report 로 생성)
sonar.eslint.reportPaths=eslint-report.json
sonar.stylelint.reportPaths=stylelint-report.json
